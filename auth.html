<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petalora - Вход и Регистрация</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/media.css">
</head>
<body class="auth-page-bg">

    <div id="header-container"></div>

    <main class="auth-wrapper container">
        <div class="auth-card">
            
            <div class="auth-tabs">
                <div class="auth-tab active" id="tabLogin" data-i18n="auth_login_tab">Вход</div>
                <div class="auth-tab" id="tabRegister" data-i18n="auth_register_tab">Регистрация</div>
            </div>

            <form class="auth-form active" id="formLogin">
                <div class="form-group">
                    <label class="form-label" data-i18n="auth_email">Email или телефон</label>
                    <input type="text" class="form-input" placeholder="Введите email или телефон" value="sokolovdenisod@gmail.com">
                </div>
                
                <div class="form-group">
                    <label class="form-label" data-i18n="auth_pass">Пароль</label>
                    <div class="password-wrapper">
                        <input type="password" class="form-input" placeholder="••••••••" value="password123">
                        <button type="button" class="toggle-password"><i class="far fa-eye"></i></button>
                    </div>
                </div>
                
                <a href="#" class="forgot-link" data-i18n="auth_forgot">Забыли пароль?</a>
                
                <button type="button" class="btn-auth" onclick="forceLogin()" data-i18n="auth_login_btn">Войти</button>
                
                <div class="auth-divider" data-i18n="auth_or_login">или войдите через</div>

                <div style="display: flex; justify-content: center; margin-bottom: 25px;">
                    <div id="g_id_onload"
                         data-client_id="ТВОЙ_CLIENT_ID.apps.googleusercontent.com"
                         data-context="signin"
                         data-ux_mode="popup"
                         data-callback="handleGoogleAuth"
                         data-auto_prompt="false">
                    </div>
                    <div class="g_id_signin"
                         data-type="standard"
                         data-shape="rectangular"
                         data-theme="outline"
                         data-text="signin_with"
                         data-size="large"
                         data-logo_alignment="center">
                    </div>
                </div>

                <div class="auth-footer">
                    <span data-i18n="auth_no_account">Нет аккаунта?</span> <span id="toRegister" data-i18n="auth_register_link" style="cursor: pointer;">Зарегистрироваться</span>
                </div>
            </form>

            <form class="auth-form" id="formRegister">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" data-i18n="auth_name">Имя</label>
                        <input type="text" class="form-input" placeholder="Имя">
                    </div>
                    <div class="form-group">
                        <label class="form-label" data-i18n="auth_surname">Фамилия</label>
                        <input type="text" class="form-input" placeholder="Фамилия">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="auth_email_only">Email</label>
                    <input type="email" class="form-input" placeholder="example@mail.com">
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="auth_phone">Телефон</label>
                    <input type="tel" class="form-input" placeholder="+380 XX XXX XX XX">
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="auth_pass">Пароль</label>
                    <div class="password-wrapper">
                        <input type="password" class="form-input" placeholder="Минимум 8 символов">
                        <button type="button" class="toggle-password"><i class="far fa-eye"></i></button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" data-i18n="auth_pass_repeat">Повторите пароль</label>
                    <div class="password-wrapper">
                        <input type="password" class="form-input" placeholder="••••••••">
                        <button type="button" class="toggle-password"><i class="far fa-eye"></i></button>
                    </div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms" checked>
                    <label for="terms">
                        <span data-i18n="auth_agree">Я согласен(а) с</span> 
                        <a href="#" data-i18n="auth_privacy">политикой конфиденциальности</a> 
                        <span data-i18n="auth_and">и</span> 
                        <a href="#" data-i18n="auth_terms">условиями использования</a>
                    </label>
                </div>

                <button type="button" class="btn-auth" onclick="forceRegister()" data-i18n="auth_register_btn">Создать аккаунт</button>

                <div class="auth-divider" data-i18n="auth_or_register">или зарегистрируйтесь через</div>

                <div style="display: flex; justify-content: center; margin-bottom: 25px;">
                     <div class="g_id_signin"
                         data-type="standard"
                         data-shape="rectangular"
                         data-theme="outline"
                         data-text="signup_with"
                         data-size="large"
                         data-logo_alignment="center">
                    </div>
                </div>

                <div class="auth-footer">
                    <span data-i18n="auth_has_account">Уже есть аккаунт?</span> <span id="toLogin" data-i18n="auth_login_link" style="cursor: pointer; color: var(--primary-color);">Войти</span>
                </div>
            </form>

        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
